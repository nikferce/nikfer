name: Supabase Ping

on:
  schedule:
    - cron: '0 9 * * 1,4'  # Her Pazartesi 09:00 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Repo'yu aktif tut — 60 gün kuralını aşar
      - uses: gautamkrishnar/keepalive-workflow@v2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # Supabase ping
      - name: Supabase ping
        run: |
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/sections?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "HTTP: $RESPONSE"
          [ "$RESPONSE" = "200" ] && echo "✅ Aktif" || exit 1
